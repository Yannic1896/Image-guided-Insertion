/insertion_node:
  ros__parameters:
    target_file: "target_output/target_location.txt"
    entry_file: "entry_point_output/needle_entry_point.txt"
    target_key: "scan_center_m"
    candidate_id: 0

    base_frame: "panda_link0"
    end_effector_frame: "panda_hand"
    needle_tip_frame: "needle_tip"

    # Needle tip is 16 cm along the end-effector +Z axis.
    needle_tip_offset_m: 0.16
    needle_axis_in_ee_frame: [0.0, 0.0, 1.0]

    approach_distance_m: 0.03
    cartesian_step_m: 0.002
    trajectory_rate_hz: 1000.0
    approach_speed_m_s: 0.06
    insertion_speed_m_s: 0.01
    joint_transition_speed_rad_s: 0.2
    max_joint_speed_rad_s: 1.0
    max_path_output_points: 1000

    joint_trajectory_topic: "/joint_position_example_controller/joint_trajectory_command"
    joint_states_topic: "/joint_states"
    entry_pose_topic: "/insertion/entry_pose"
    pre_entry_pose_topic: "/insertion/pre_entry_pose"
    target_pose_topic: "/insertion/target_pose"
    planned_tip_path_topic: "/insertion/planned_tip_path"

    joint_names:
      - "panda_joint1"
      - "panda_joint2"
      - "panda_joint3"
      - "panda_joint4"
      - "panda_joint5"
      - "panda_joint6"
      - "panda_joint7"
    max_step: 0.05
