/**:
  ros__parameters:
    # Scanning mode: 'hand_eye' or 'model_registration'
    scanning_mode: model_registration
    max_samples: 30
    command_delay: 5.0
    max_retries: 5
    joint_feedback_timeout: 1.0
    trajectory_goal_tolerance: 0.01
    joint_states_topic: /franka_state_controller/joint_states_desired
    trajectory_finished_topic: /trajectory_finished
    scan_complete_topic: /scanning/complete
    joint_names: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    motion_start_threshold: 0.002

    # Model-registration capture synchronization.
    # Cloud stitcher captures on its own after the robot settles, then publishes
    # true on pose_capture_done_topic. capture_wait_timeout is a fallback timer.
    pose_capture_done_topic: /cloud_stitcher/pose_capture_done
    use_capture_feedback: true
    capture_wait_timeout: 15.0
    publish_pointcloud_trigger: false

    # Workspace bounding box for hand-eye poses [m]
    x_min: 0.40
    x_max: 0.85
    y_min: -0.30
    y_max: 0.30
    z_min: 0.40
    z_max: 0.70

    center_x: 0.2
    center_y: 0.0
    center_z: 0.6

    roll_deg: 138.8
    pitch_deg: 42.8
    yaw_deg: -104.8
